name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Apply `bench-scale` for an immediate run and on subsequent PR pushes.
  # Manual runs and label events cannot replace correctness check results.
  scale-artifact:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'bench-scale') &&
       (github.event.action != 'labeled' || github.event.label.name == 'bench-scale'))
    env:
      CARGO_TARGET_DIR: target/scale
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target/scale"
      - name: Run scale gate against Cargo-reported native artifact
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          test -n "$host"
          cargo run -p xtask -- bench-scale --target "$host"
