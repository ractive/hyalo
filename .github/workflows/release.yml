name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish only the npm packages after building and dry-running everything
        type: boolean
        required: false
        default: false
      prepare_npm_bootstrap:
        description: Sign and upload npm tarballs for the initial owner publication
        type: boolean
        required: false
        default: false
      prepare_npm_main_bootstrap:
        description: Sign and upload only the scoped main npm package without native builds
        type: boolean
        required: false
        default: false
      npm_version:
        description: Cargo version to confirm for npm publication or bootstrap preparation
        type: string
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      !inputs.prepare_npm_main_bootstrap
    uses: ractive/release-workflows/.github/workflows/release.yml@v0.2.0
    secrets: inherit
    with:
      bin-name: hyalo
      version-package: hyalo-cli
      publish-crates: hyalo-core,hyalo-mdlint,hyalo-cli
      winget-identifier: ractive.hyalo
      enable-linux-packages: true
      linux-package-crate: hyalo-cli
      # Publishes the .deb/.rpm to the hosted apt/yum repos at Cloudsmith
      # (non-blocking; needs the CLOUDSMITH_API_KEY repo secret):
      cloudsmith-repo: ractive/hyalo
      # Publishes a -bin PKGBUILD to the AUR (non-blocking; needs the
      # AUR_SSH_PRIVATE_KEY repo secret):
      aur-package: hyalo-bin
      # Ship shell completions in archives and deb/rpm. Copies into
      # crates/hyalo-cli/ because cargo-deb/cargo-generate-rpm resolve
      # asset paths relative to the crate directory.
      pre-package-command: |
        mkdir -p completions
        if [ "$CROSS" = "true" ] || [ "$TARGET" = "aarch64-pc-windows-msvc" ]; then
          # Target binary is not host-runnable: generate with a host build.
          cargo run --release -p hyalo-cli --bin hyalo -- completions bash > completions/hyalo.bash
          cargo run --release -p hyalo-cli --bin hyalo -- completions zsh  > completions/_hyalo
          cargo run --release -p hyalo-cli --bin hyalo -- completions fish > completions/hyalo.fish
        else
          "$BIN_PATH" completions bash > completions/hyalo.bash
          "$BIN_PATH" completions zsh  > completions/_hyalo
          "$BIN_PATH" completions fish > completions/hyalo.fish
        fi
        mkdir -p crates/hyalo-cli/completions
        cp completions/* crates/hyalo-cli/completions/
      extra-archive-paths: completions
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
      # Same matrix as the shared default, but the two QEMU-emulated aarch64
      # Linux targets build only. Native tests already gate every PR on
      # Linux/macOS/Windows; under emulation the suite took ~950 s and lost
      # two timing races in the v0.21.0 pipeline (a 1,000,000-value jq cap
      # test vs the 3 s time limit; a piped `hyalo | xargs -0` round-trip).
      targets: >-
        [
          {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": false, "run_tests": true},
          {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true, "run_tests": true},
          {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": true, "run_tests": false},
          {"target": "aarch64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true, "run_tests": false},
          {"target": "aarch64-apple-darwin", "os": "macos-latest", "cross": false, "run_tests": true},
          {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "cross": false, "run_tests": true},
          {"target": "aarch64-pc-windows-msvc", "os": "windows-latest", "cross": false, "run_tests": false}
        ]

  npm:
    needs: release
    if: >-
      always() &&
      !cancelled() &&
      (
        needs.release.result == 'success' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.prepare_npm_main_bootstrap &&
          needs.release.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Pin npm and resolve Cargo version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISH_NPM: ${{ inputs.publish_npm }}
          PREPARE_NPM_BOOTSTRAP: ${{ inputs.prepare_npm_bootstrap }}
          PREPARE_NPM_MAIN_BOOTSTRAP: ${{ inputs.prepare_npm_main_bootstrap }}
          REQUESTED_NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '.packages[] | select(.name == "hyalo-cli") | .version' \
            <<< "$metadata")
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "hyalo-cli version was not found in cargo metadata" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = release ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag '$RELEASE_TAG' does not match Cargo version '$version'" >&2
            exit 1
          fi
          selected_modes=0
          for selected in \
            "$PUBLISH_NPM" "$PREPARE_NPM_BOOTSTRAP" "$PREPARE_NPM_MAIN_BOOTSTRAP"; do
            if [ "$selected" = true ]; then
              selected_modes=$((selected_modes + 1))
            fi
          done
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$selected_modes" -gt 1 ]; then
            echo "publish_npm, prepare_npm_bootstrap, and prepare_npm_main_bootstrap are mutually exclusive" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] && \
             [ "$selected_modes" -eq 1 ] && \
             [ "$REQUESTED_NPM_VERSION" != "$version" ]; then
            echo "npm_version '$REQUESTED_NPM_VERSION' does not match Cargo version '$version'" >&2
            exit 1
          fi
          echo "CARGO_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build npm API artifacts
        run: |
          npm --prefix npm/hyalo ci --ignore-scripts
          npm --prefix npm/hyalo run typecheck
          npm --prefix npm/hyalo run build
      - name: Download native release archives
        if: ${{ !inputs.prepare_npm_main_bootstrap }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hyalo-*
          path: ${{ runner.temp }}/hyalo-release-artifacts
      - name: Extract exact release binaries and stage npm packages
        if: ${{ !inputs.prepare_npm_main_bootstrap }}
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/hyalo-release-artifacts
          BINARY_INPUT: ${{ runner.temp }}/hyalo-npm-binaries
          STAGE_DIR: ${{ runner.temp }}/hyalo-npm-stage
        run: |
          set -euo pipefail
          [ ! -e "$BINARY_INPUT" ]
          [ ! -e "$STAGE_DIR" ]
          mkdir "$BINARY_INPUT"
          jq -r '.[] | [.target, .os] | @tsv' npm/hyalo/platforms.json |
            while IFS=$'\t' read -r target os; do
              artifact="$ARTIFACT_DIR/hyalo-$target"
              if [ "$os" = win32 ]; then
                archive="hyalo-v$CARGO_VERSION-$target.zip"
                binary="hyalo.exe"
              else
                archive="hyalo-v$CARGO_VERSION-$target.tar.gz"
                binary="hyalo"
              fi
              test -d "$artifact"
              count=$(find "$artifact" -maxdepth 1 -type f -name "$archive" | wc -l)
              test "$count" -eq 1
              unpack="$RUNNER_TEMP/hyalo-unpack-$target"
              mkdir "$unpack"
              if [ "$os" = win32 ]; then
                unzip -q "$artifact/$archive" -d "$unpack"
              else
                tar -xzf "$artifact/$archive" -C "$unpack"
              fi
              test -f "$unpack/$binary"
              test -f "$unpack/LICENSE"
              test -f "$unpack/README.md"
              mkdir "$BINARY_INPUT/$target"
              install -m 755 "$unpack/$binary" "$BINARY_INPUT/$target/$binary"
            done
          cargo run -p xtask -- generate-npm-packages \
            --stage "$STAGE_DIR" --binaries "$BINARY_INPUT"
      - name: Pack and dry-run all publications
        if: ${{ !inputs.prepare_npm_main_bootstrap }}
        shell: bash
        env:
          STAGE_DIR: ${{ runner.temp }}/hyalo-npm-stage
          PACK_DIR: ${{ runner.temp }}/hyalo-npm-packs
        run: |
          set -euo pipefail
          mkdir "$PACK_DIR"
          PUBLISH_DRY_RUN_CACHE=$(mktemp -d "$RUNNER_TEMP/hyalo-npm-dry-run.XXXXXX")
          : > "$PACK_DIR/packages.tsv"
          for package_dir in \
            darwin-arm64 linux-x64 linux-arm64 linux-x64-musl \
            linux-arm64-musl win32-x64 win32-arm64 hyalo; do
            npm pack "$STAGE_DIR/$package_dir" \
              --pack-destination "$PACK_DIR" --json > "$PACK_DIR/$package_dir.json"
            tarball=$(jq -r '.[0].filename' "$PACK_DIR/$package_dir.json")
            test -n "$tarball"
            printf '%s\t%s\n' "$package_dir" "$PACK_DIR/$tarball" \
              >> "$PACK_DIR/packages.tsv"
            env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
              npm publish "$PACK_DIR/$tarball" \
                --dry-run --offline --cache "$PUBLISH_DRY_RUN_CACHE" \
                --ignore-scripts --access public \
                --registry https://registry.npmjs.org
          done
      - name: Plan immutable npm publication
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
        shell: bash
        env:
          PACK_DIR: ${{ runner.temp }}/hyalo-npm-packs
        run: |
          set -euo pipefail
          cargo run -q -p xtask -- plan-npm-publication --pack-json \
            "$PACK_DIR/darwin-arm64.json" \
            "$PACK_DIR/linux-x64.json" \
            "$PACK_DIR/linux-arm64.json" \
            "$PACK_DIR/linux-x64-musl.json" \
            "$PACK_DIR/linux-arm64-musl.json" \
            "$PACK_DIR/win32-x64.json" \
            "$PACK_DIR/win32-arm64.json" \
            "$PACK_DIR/hyalo.json" \
            > "$PACK_DIR/publication-plan.json"
      - name: Pack and dry-run scoped main bootstrap
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.prepare_npm_main_bootstrap
        shell: bash
        env:
          PACK_DIR: ${{ runner.temp }}/hyalo-npm-packs
        run: |
          set -euo pipefail
          cargo run -q -p xtask -- generate-npm-packages --check
          mkdir "$PACK_DIR"
          PUBLISH_DRY_RUN_CACHE=$(mktemp -d "$RUNNER_TEMP/hyalo-npm-dry-run.XXXXXX")
          npm pack ./npm/hyalo \
            --pack-destination "$PACK_DIR" --json > "$PACK_DIR/hyalo.json"
          test "$(jq -r 'length' "$PACK_DIR/hyalo.json")" -eq 1
          test "$(jq -r '.[0].name' "$PACK_DIR/hyalo.json")" = @ractive-ch/hyalo
          test "$(jq -r '.[0].version' "$PACK_DIR/hyalo.json")" = "$CARGO_VERSION"
          tarball=$(jq -r '.[0].filename' "$PACK_DIR/hyalo.json")
          test "$tarball" = "ractive-ch-hyalo-$CARGO_VERSION.tgz"
          {
            printf '%s\n' \
              LICENSE README.md bin/hyalo.js \
              dist/api.d.ts dist/index.cjs dist/index.d.ts dist/index.mjs \
              dist/pi-runtime.d.ts dist/types.d.ts \
              lib/resolve-platform.d.ts lib/resolve-platform.js \
              lib/run-child.js package.json platforms.json
            find npm/hyalo/src/generated -maxdepth 1 -type f -name '*.ts' -print \
              | sed -e 's#npm/hyalo/src/#dist/#' -e 's#\.ts$#.d.ts#'
          } | sort > "$PACK_DIR/hyalo-expected-files.txt"
          jq -r '.[0].files[].path' "$PACK_DIR/hyalo.json" \
            | sort > "$PACK_DIR/hyalo-actual-files.txt"
          diff -u "$PACK_DIR/hyalo-expected-files.txt" "$PACK_DIR/hyalo-actual-files.txt"
          printf 'hyalo\t%s\n' "$PACK_DIR/$tarball" > "$PACK_DIR/packages.tsv"
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            npm publish "$PACK_DIR/$tarball" \
              --dry-run --offline --cache "$PUBLISH_DRY_RUN_CACHE" \
              --ignore-scripts --access public \
              --registry https://registry.npmjs.org
      - name: Sign npm bootstrap tarballs with GitHub OIDC
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.prepare_npm_bootstrap || inputs.prepare_npm_main_bootstrap)
        shell: bash
        env:
          PACK_DIR: ${{ runner.temp }}/hyalo-npm-packs
          MAIN_ONLY: ${{ inputs.prepare_npm_main_bootstrap }}
        run: |
          set -euo pipefail
          NPM_PACKAGE_DIR="$(npm root --global)/npm"
          export NPM_PACKAGE_DIR
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { readFile, writeFile } from 'node:fs/promises'
          import { createRequire } from 'node:module'
          import path from 'node:path'

          const packDir = process.env.PACK_DIR
          const npmPackageDir = process.env.NPM_PACKAGE_DIR
          assert(packDir && npmPackageDir && process.env.CARGO_VERSION)

          const npmPackagePath = path.join(npmPackageDir, 'package.json')
          const npmManifest = JSON.parse(await readFile(npmPackagePath, 'utf8'))
          assert.equal(npmManifest.version, '11.19.1')
          const requireFromNpm = createRequire(npmPackagePath)
          const npa = requireFromNpm('npm-package-arg')
          const { generateProvenance } = requireFromNpm(
            'libnpmpublish/lib/provenance.js'
          )

          const packageDirs = process.env.MAIN_ONLY === 'true'
            ? ['hyalo']
            : [
                'darwin-arm64', 'linux-x64', 'linux-arm64', 'linux-x64-musl',
                'linux-arm64-musl', 'win32-x64', 'win32-arm64', 'hyalo',
              ]
          const rows = (await readFile(path.join(packDir, 'packages.tsv'), 'utf8'))
            .trimEnd().split('\n').map((row) => row.split('\t'))
          assert.deepEqual(rows.map(([packageDir]) => packageDir), packageDirs)

          for (const [packageDir, tarball, ...extra] of rows) {
            assert.equal(extra.length, 0)
            const [pack] = JSON.parse(await readFile(
              path.join(packDir, `${packageDir}.json`), 'utf8'
            ))
            assert.equal(path.basename(tarball), pack.filename)
            const manifest = JSON.parse(execFileSync(
              'tar', ['-xOf', tarball, 'package/package.json'], { encoding: 'utf8' }
            ))
            assert.equal(manifest.name, pack.name)
            assert.equal(manifest.version, pack.version)
            assert.equal(manifest.version, process.env.CARGO_VERSION)
            if (packageDir === 'hyalo') {
              assert.equal(manifest.name, '@ractive-ch/hyalo')
            }

            const tarballBytes = await readFile(tarball)
            const digest = createHash('sha512').update(tarballBytes).digest()
            assert.equal(pack.integrity, `sha512-${digest.toString('base64')}`)
            const subject = {
              name: npa.toPurl(npa.resolve(manifest.name, manifest.version)),
              digest: { sha512: digest.toString('hex') },
            }
            const bundle = await generateProvenance([subject], {})
            const bundlePath = tarball.replace(/\.tgz$/, '.sigstore.json')
            assert.notEqual(bundlePath, tarball)
            await writeFile(bundlePath, `${JSON.stringify(bundle)}\n`, { flag: 'wx' })
            console.log(`Signed ${path.basename(tarball)}`)
          }
          NODE
      - name: Upload signed npm bootstrap packages
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.prepare_npm_bootstrap || inputs.prepare_npm_main_bootstrap)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-bootstrap-${{ env.CARGO_VERSION }}
          path: ${{ runner.temp }}/hyalo-npm-packs
          if-no-files-found: error
      - name: Publish platform packages, then main package
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
        shell: bash
        env:
          PACK_DIR: ${{ runner.temp }}/hyalo-npm-packs
        run: |
          set -euo pipefail
          publish_or_skip() {
            local action=$1
            local name=$2
            local tarball=$3
            test -f "$tarball"
            if [ "$action" = skip ]; then
              echo "Skipping $name: identical immutable version already published"
            elif [ "$action" = publish ]; then
              npm publish "$tarball" \
                --provenance --access public --ignore-scripts \
                --registry https://registry.npmjs.org
            else
              echo "unexpected publication action '$action' for $name" >&2
              return 1
            fi
          }
          while IFS=$'\t' read -r action name tarball; do
            publish_or_skip "$action" "$name" "$tarball"
          done < <(jq -r '.[0:7][] | [.action, .name, .tarball] | @tsv' \
            "$PACK_DIR/publication-plan.json")
          IFS=$'\t' read -r action name tarball < <(
            jq -r '.[7] | [.action, .name, .tarball] | @tsv' \
              "$PACK_DIR/publication-plan.json"
          )
          test "$name" = @ractive-ch/hyalo
          publish_or_skip "$action" "$name" "$tarball"
