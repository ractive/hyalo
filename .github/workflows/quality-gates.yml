name: Quality Gates

on:
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check feature fanout
        run: cargo run -p xtask -- check-feature-fanout
      - name: Check help drift
        run: cargo run -p xtask -- check-help-drift
      - name: Check every subcommand is in COMMAND REFERENCE
        run: cargo run -p xtask -- check-command-reference
      - name: Check bundled skills pass the skills profile
        run: cargo run -p xtask -- check-bundled-skills
      - name: Check pi-package vendored copies are in sync
        run: cargo run -p xtask -- check-pi-package-sync
      - name: Check every shipped --jq recipe executes
        run: cargo run -p xtask -- check-jq-recipes
      - name: Check mutating commands go through MutationJournal
        run: cargo run -p xtask -- check-mutation-journal
