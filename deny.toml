# Configuration for cargo-deny — https://embarkstudios.github.io/cargo-deny/
#
# Run locally: cargo deny check
# Runs automatically as a quality gate in the *release* pipeline only — the
# `cargo deny check` step lives in the external, shared
# `ractive/release-workflows` release.yml (this repo's own release.yml just
# `uses:` it), which fires on `release: published` / `workflow_dispatch`. It
# is NOT part of `ci.yml`/`quality-gates.yml`, so it does not gate ordinary
# PRs — only a release cut (verified 2026-08-24, iter-222, by pulling the
# shared workflow's content via `gh api`).

[advisories]
# No ignores (re-verified 2026-10-03). RUSTSEC-2025-0141 (bincode) and
# RUSTSEC-2024-0320 (yaml-rust) used to be ignored because they came in via
# `comrak -> syntect`; hyalo-mdlint now builds comrak with
# `default-features = false`, so syntect, bincode and yaml-rust are gone
# from the tree (`cargo tree -i bincode` / `-i yaml-rust` match nothing) and
# the stale ignores were dropped. Prefer upgrading over ignoring: e.g.
# RUSTSEC-2026-0190 (anyhow) was fixed by bumping anyhow, not ignored.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# No license exceptions: the only one we ever needed was `mdbook` (MPL-2.0),
# pulled in as an unused dependency of mdbook-lint-core 0.14. Upstream removed
# it in 0.15.2, so the whole subtree — and the exception — is gone (iter-193).

# `toml` 0.5 is still duplicated against `toml` 1.x: mdbook-lint-core /
# mdbook-lint-rulesets 0.16.0 have not moved off 0.5 (upstream
# joshrotenberg/mdbook-lint#459). Re-checked 2026-10-03 at 0.16.2 (still
# the latest release): unchanged. The graph `cargo deny list` checks is now
# 166 crate versions. The other duplicates it warns about: getrandom/r-efi
# and thiserror 2.0.18 (serde-saphyr 0.0.23 via ahash / saphyr-parser-bw;
# held back, see Cargo.toml), thiserror 1 (mdbook-lint), strsim (mdbook-lint's
# darling 0.14), and syn (xtask's syn 3 vs proc-macro crates on syn 1/2).
[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
