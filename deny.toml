# Configuration for cargo-deny — https://embarkstudios.github.io/cargo-deny/
#
# Run locally: cargo deny check
# Runs automatically as a quality gate in the *release* pipeline only — the
# `cargo deny check` step lives in the external, shared
# `ractive/release-workflows` release.yml (this repo's own release.yml just
# `uses:` it), which fires on `release: published` / `workflow_dispatch`. It
# is NOT part of `ci.yml`/`quality-gates.yml`, so it does not gate ordinary
# PRs — only a release cut (verified 2026-08-24, iter-222, by pulling the
# shared workflow's content via `gh api`).

[advisories]
# Ignore list last re-verified 2026-08-24 (iter-222): both advisories still
# resolve through the same `comrak -> syntect` chain and nothing else in the
# tree pulls them. RUSTSEC-2026-0190 (anyhow `Error::downcast_mut`
# unsoundness, patched >= 1.0.103) is deliberately NOT in this ignore list —
# it was resolved by bumping anyhow (1.0.102 -> 1.0.104 via `cargo update -p
# anyhow`; the workspace `Cargo.toml` requirement is already `"1"`, so no
# manifest edit was needed) rather than ignored, since a clean upgrade was
# available.
ignore = [
    # bincode 1.x is unmaintained; pulled in via comrak -> syntect (syntax
    # highlighting caches). No safe upgrade on the syntect 5.x line; not
    # exposed to untrusted input in our usage. Mirrors cargo-audit, which
    # reports unmaintained as a warning, not an error.
    # Re-checked 2026-08-22: chain unchanged (comrak 0.21 -> syntect 5.3).
    "RUSTSEC-2025-0141",
    # yaml-rust is unmaintained; same comrak -> syntect dependency chain,
    # used only to parse syntect's bundled theme/syntax definitions.
    # Re-checked 2026-08-22: chain unchanged (comrak 0.21 -> syntect 5.3).
    "RUSTSEC-2024-0320",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

# No license exceptions: the only one we ever needed was `mdbook` (MPL-2.0),
# pulled in as an unused dependency of mdbook-lint-core 0.14. Upstream removed
# it in 0.15.2, so the whole subtree — and the exception — is gone (iter-193).

# `toml` 0.5 is still duplicated against `toml` 1.x: mdbook-lint-core /
# mdbook-lint-rulesets 0.16.0 have not moved off 0.5 (upstream
# joshrotenberg/mdbook-lint#459). Re-checked 2026-08-22 (iter-196); the
# 0.15.2 -> 0.16.0 bump left the unique-crate count at 136 (upstream #489
# only moved `glob` from rulesets to core).
[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
