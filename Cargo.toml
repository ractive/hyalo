[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/hyalo-cli"]

[workspace.package]
version = "0.24.1"
edition = "2024"
# MSRV: AtomicU64::try_update (stable in 1.95) is the newest std API in use;
# checked with `cargo +1.95 check --workspace --all-targets`.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ractive/hyalo"

[workspace.dependencies]
# Internal crates
hyalo-core = { path = "crates/hyalo-core", version = "0.24.1" }
hyalo-mdlint = { path = "crates/hyalo-mdlint", version = "0.24.1" }

# External dependencies
anyhow = "1"
assert_cmd = "2"
clap = "4.6.7"
clap_complete = "4.6.11"
ctrlc = { version = "3.5", features = ["termination"] }
criterion = { version = "0.8", features = ["html_reports"] }
dunce = "1"
globset = "0.4"
# Pinned: hyalo-core/src/ignore_classify.rs ports this exact version's private
# precedence logic (DEC-349); a bump needs the differential tests in discovery.rs reviewed.
ignore = "=0.4.33"
indexmap = { version = "2", features = ["serde"] }
memchr = "2"
libc = "0.2"
jaq-core = "3.1.1"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.3"
predicates = "3"
rayon = "1"
regex = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
# 1.x resolves leading-zero decimals (`zip: 01234`) as floats and offers no
# option to keep them integers, so hyalo-core re-resolves them itself
# (`frontmatter::parse::resolve_core_int`, DEC-350). A bump must keep
# the serde-saphyr pins in hyalo-core `frontmatter::tests` green.
serde-saphyr = "1.3.0"
aho-corasick = "1"
strsim = "0.11"
serde_json = "1.0.151"
tempfile = "3"
same-file = "1"
winapi-util = "0.1"
toml = "1"
toml_edit = "0.25"
rust-stemmers = "1.2.0"
# NFKD decomposition for tokenizer v4 diacritic folding (DEC-336): nothing in
# the tree provided it (deunicode transliterates, which would mangle CJK).
unicode-normalization = "0.1.25"
walkdir = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
# Keep native ts-rs output: optional formatting pulls in unmaintained smartstring
# through dprint/SWC (RUSTSEC-2026-0249), without changing the generated types.
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "indexmap-impl"] }

[workspace.lints.clippy]
# Enable the full pedantic group, then allow lints we intentionally skip.
pedantic = { level = "warn", priority = -1 }

# Intentionally allowed — not worth the noise/churn:
must_use_candidate = "allow"          # too many false positives on builder-style APIs
return_self_not_must_use = "allow"    # same rationale as must_use_candidate
doc_markdown = "allow"                # backtick suggestions for identifiers in docs
missing_errors_doc = "allow"          # # Errors sections not required yet
missing_panics_doc = "allow"          # # Panics sections not required yet
too_many_lines = "allow"              # function length — addressed structurally, not per-lint
module_name_repetitions = "allow"     # e.g. filter::FilterOp is fine
struct_excessive_bools = "allow"      # CLI options structs legitimately need bools

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[profile.bench]
codegen-units = 1
lto = true
