[package]
name = "hyalo-mdlint"
description = "Markdown linting engine for hyalo — wraps mdbook-lint-core + HYALO native rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
strsim = { workspace = true }
hyalo-core = { workspace = true }

# Markdown linting engine
mdbook-lint-core = "0.16"
mdbook-lint-rulesets = { version = "0.16", default-features = false, features = ["standard"] }
# Only AST node types are used; defaults pull in an unused CLI/highlighter and
# syntect's unmaintained bincode/yaml-rust dependencies.
comrak = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
