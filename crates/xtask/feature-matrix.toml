# Feature-fanout matrix for hyalo flags.
#
# Each entry under [flags."--X"] declares which real Clap invocation MUST
# expose --X. The gate consumes `hyalo_cli::describe_invocation`; this file is
# test data, not a second command schema.
#
# When adding a new cross-cutting flag, add it here and ensure all listed
# subcommands implement it before merging.

[invocations]
find = ["find"]
lint = ["lint"]
mv = ["mv", "a.md", "b.md"]
set = ["set", "a.md", "--property", "status=done"]
remove = ["remove", "a.md", "--property", "status"]
append = ["append", "a.md", "--property", "tags=x"]
read = ["read", "a.md"]
backlinks = ["backlinks", "a.md"]
summary = ["summary"]
"links fix" = ["links", "fix"]
tags = ["tags"]
properties = ["properties"]
"task read" = ["task", "read", "a.md", "--all"]
"task toggle" = ["task", "toggle", "a.md", "--all"]
"task set" = ["task", "set", "a.md", "--all", "--status", "done"]
"views run" = ["views", "run", "saved"]

[flags."--files-from"]
required_in = ["find", "lint", "mv", "set", "remove", "append", "read", "backlinks", "task read", "task toggle", "task set"]
shape = "selector"

[flags."--glob"]
required_in = ["find", "lint", "mv", "set", "remove", "append", "task toggle", "task set"]
shape = "selector"

[flags."--index-file"]
required_in = ["find", "lint", "summary", "backlinks", "links fix", "tags", "properties"]
shape = "read-source"

# Envelope-shape contracts.
# Commands listed under files_from_counters MUST surface
# files_missing / files_skipped_non_md / files_skipped_outside_vault
# under .results when --files-from is in effect.
[envelopes]
files_from_counters = ["find", "lint", "mv", "set", "remove", "append", "read", "backlinks"]
